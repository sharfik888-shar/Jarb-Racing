<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jarb Racing</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* --- ЭКРАНЫ --- */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 10;
        }
        .screen.active { display: flex; }
        
        h1 { color: #fff; font-size: 42px; text-shadow: 3px 3px 0 #e53935, 0 0 20px rgba(0,0,0,0.5); margin-bottom: 20px; font-style: italic; letter-spacing: 1px; }
        h2 { color: #fff; font-size: 28px; margin-bottom: 15px; text-shadow: 2px 2px 0 #000; }
        
        .menu-btn {
            background: linear-gradient(to bottom, #ffcc00, #ff9900); 
            border: 2px solid #fff; padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 10px;
            margin: 8px; cursor: pointer; color: #222; box-shadow: 0 5px 0 #b30000; transition: transform 0.1s;
            width: 240px; text-align: center;
        }
        .menu-btn:active { transform: translateY(5px); box-shadow: 0 0 0 #b30000; }

        /* Настройки в меню */
        #settingsMenu .menu-btn { background: linear-gradient(to bottom, #4caf50, #2e7d32); box-shadow: 0 5px 0 #1b5e20; }

        /* Гараж */
        .car-list { display: flex; flex-direction: column; gap: 10px; width: 90%; max-width: 400px; max-height: 60vh; overflow-y: auto; padding: 5px; }
        .car-card {
            background: rgba(0,0,0,0.4); border: 2px solid rgba(255,255,255,0.2); padding: 12px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center; color: #fff;
        }
        .car-card.selected { border-color: #ffcc00; background: rgba(255,204,0,0.15); box-shadow: 0 0 10px rgba(255,204,0,0.3); }
        .car-card button { background: #4caf50; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; }
        .car-card button:disabled { background: #777; cursor: not-allowed; }
        .car-card button.buy-btn { background: #2196f3; }
        
        /* Прокачка */
        .upgrade-row { display: flex; justify-content: space-between; width: 85%; max-width: 400px; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 10px; color: #fff; margin-bottom: 10px; align-items: center;}
        .upgrade-row button { background: #ffcc00; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; color: #222; }

        /* Интерфейс игры */
        #game-ui {
            position: absolute; bottom: 20px; width: 100%; display: none;
            justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 5;
        }
        .pedal {
            width: 90px; height: 90px; background: rgba(255,255,255,0.3);
            border: 3px solid rgba(0,0,0,0.5); border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-size: 40px; font-weight: bold;
            user-select: none; -webkit-user-select: none; backdrop-filter: blur(5px); color: #000;
        }
        .pedal:active { background: rgba(255,255,255,0.8); }
        
        /* Кнопки в игре */
        #inGameSettings { 
            position: absolute; top: 20px; right: 20px; z-index: 11; display: none; 
            background: rgba(0,0,0,0.6); color: #fff; border: 2px solid #fff; 
            border-radius: 50%; width: 50px; height: 50px; font-size: 24px; cursor: pointer;
            justify-content: center; align-items: center;
        }
        
        #gameStats {
            position: absolute; top: 20px; left: 20px; z-index: 11; display: none;
            background: rgba(0,0,0,0.6); color: #fff; padding: 10px 15px; border-radius: 10px;
            font-size: 18px; font-weight: bold; border: 1px solid #fff;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- Главное меню -->
    <div id="mainMenu" class="screen active">
        <h1>JARB RACING</h1>
        <button class="menu-btn" onclick="showScreen('garageMenu')">МАШИНЫ</button>
        <button class="menu-btn" onclick="startGame()">ИГРАТЬ</button>
        <button class="menu-btn" onclick="showScreen('settingsMenu')">НАСТРОЙКИ</button>
    </div>

    <!-- Гараж -->
    <div id="garageMenu" class="screen">
        <h2>ГАРАЖ</h2>
        <div class="car-list" id="carList"></div>
        <button class="menu-btn" style="margin-top:20px" onclick="showScreen('mainMenu')">НАЗАД</button>
    </div>

    <!-- Тюнинг -->
    <div id="upgradeMenu" class="screen">
        <h2 id="upgradeTitle">ТЮНИНГ</h2>
        <div class="upgrade-row">
            <span>Двигатель (Ур. <span id="engLvl">1</span>)</span>
            <button onclick="upgradePart('engine')">Улучшить ($500)</button>
        </div>
        <div class="upgrade-row">
            <span>Подвеска (Ур. <span id="susLvl">1</span>)</span>
            <button onclick="upgradePart('suspension')">Улучшить ($300)</button>
        </div>
        <button class="menu-btn" style="margin-top:20px" onclick="showScreen('garageMenu')">НАЗАД</button>
    </div>

    <!-- Настройки -->
    <div id="settingsMenu" class="screen">
        <h2>НАСТРОЙКИ</h2>
        <button class="menu-btn" onclick="toggleSound()">ЗВУК: <span id="soundStatus">ВКЛ</span></button>
        <button class="menu-btn" onclick="toggleMusic()">МУЗЫКА: <span id="musicStatus">ВКЛ</span></button>
        <button class="menu-btn" style="margin-top:20px" onclick="showScreen('mainMenu')">НАЗАД</button>
    </div>

    <!-- Интерфейс игры -->
    <div id="gameStats">$<span id="moneyDisplay">0</span> | <span id="distDisplay">0</span>м</div>
    <div id="inGameSettings" onclick="pauseGame()">⚙️</div>
    
    <div id="game-ui">
        <div class="pedal" id="brakeBtn">◀</div>
        <div class="pedal" id="gasBtn">▶</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // --- БАЗА ДАННЫХ ---
        const carDatabase = [
            { id: 'cobalt', name: 'Chevrolet Cobalt', color: '#b0bec5', engine: 1, suspension: 1, price: 0, owned: true, type: 'sedan' },
            { id: 'mark2', name: 'Toyota Mark II', color: '#f5f5f5', engine: 1, suspension: 1, price: 1500, owned: false, type: 'sedan' },
            { id: 'camry', name: 'Toyota Camry', color: '#37474f', engine: 1, suspension: 1, price: 3000, owned: false, type: 'sedan' },
            { id: 'tucson', name: 'Hyundai Tucson', color: '#43a047', engine: 1, suspension: 1, price: 6000, owned: false, type: 'suv' }
        ];
        let selectedCar = carDatabase[0];
        
        // --- ИГРОВЫЕ ДАННЫЕ (Сохраняются пока открыта вкладка) ---
        let money = 1500; 
        let totalDistance = 0;
        let currentRunDistance = 0;

        // --- ПЕРЕМЕННЫЕ ---
        let isPlaying = false;
        let isPaused = false;
        let musicOn = true, soundOn = true;
        let cameraX = 0, cameraY = 0;
        let gasPressed = false, brakePressed = false;
        let particles = [];

        const car = {
            x: 200, y: 100, vx: 0, vy: 0, angle: 0, angVel: 0,
            width: 100, height: 45, wheelBase: 70, wheelRadius: 20
        };

        let terrain = [], puddles = [], clouds = [], birds = [], animals = [];

        function initWorld() {
            for(let i=0; i<15; i++) clouds.push({ x: Math.random()*width*2, y: Math.random()*height*0.4 + 20, speed: Math.random()*0.5 + 0.1, size: Math.random()*30 + 20 });
            for(let i=0; i<5; i++) birds.push({ x: Math.random()*width*2, y: Math.random()*height*0.3 + 50, speed: Math.random()*1.5 + 0.5, frame: 0 });
        }
        initWorld();

        function generateTerrain(startX, endX) {
            for (let x = startX; x < endX; x += 10) {
                if (x % 1500 === 0 && Math.random() < 0.4) puddles.push({ x: x, w: 150 + Math.random() * 200 });
                
                // Плавные горы
                let y = height - 100 + Math.sin(x * 0.002) * 80 + Math.sin(x * 0.005) * 40 + Math.sin(x * 0.0008) * 150;
                terrain.push({ x: x, y: y });
                
                // Животные
                if (x % 300 === 0 && Math.random() < 0.4) {
                    let types = ['cow', 'horse', 'goat'];
                    animals.push({ x: x, type: types[Math.floor(Math.random()*3)], offsetY: Math.random() * 40 });
                }
            }
        }
        
        // Инициализация первого куска земли
        generateTerrain(-1000, 5000);

        function getTerrainY(x) {
            let index = Math.floor((x + 1000) / 10);
            if (index < 0) return height + 200;
            if (index >= terrain.length) return height + 200;
            return terrain[index].y;
        }

        // --- МЕНЮ ---
        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            if(id !== 'none') document.getElementById(id).classList.add('active');
            
            if(id === 'garageMenu') renderGarage();
            if(id === 'upgradeMenu') renderUpgrades();
        }

        function renderGarage() {
            let html = '';
            carDatabase.forEach(c => {
                let isSel = selectedCar.id === c.id;
                let btn = c.owned 
                    ? `<button onclick="selectCar('${c.id}')" ${isSel?'disabled':''}>${isSel?'ВЫБРАНА':'ВЫБРАТЬ'}</button>`
                    : `<button class="buy-btn" onclick="buyCar('${c.id}')">$${c.price}</button>`;
                
                let upgBtn = c.owned ? `<button style="background:#ff9800; margin-left:5px" onclick="openUpgrades('${c.id}')">⚙️</button>` : '';
                
                html += `
                <div class="car-card ${isSel?'selected':''}">
                    <div>
                        <strong>${c.name}</strong><br>
                        <small style="color:#bbb">Двиг: ${c.engine} | Подв: ${c.suspension}</small>
                    </div>
                    <div>${btn}${upgBtn}</div>
                </div>`;
            });
            html += `<div style="color:#4caf50; font-size:24px; margin-top:10px; text-align:center; font-weight:bold;">Баланс: $${money}</div>`;
            document.getElementById('carList').innerHTML = html;
        }

        function selectCar(id) {
            selectedCar = carDatabase.find(c => c.id === id);
            renderGarage();
        }

        function buyCar(id) {
            let c = carDatabase.find(c => c.id === id);
            if(money >= c.price) {
                money -= c.price;
                c.owned = true;
                selectedCar = c;
                renderGarage();
            } else {
                alert("Недостаточно долларов!");
            }
        }

        function openUpgrades(id) {
            selectedCar = carDatabase.find(c => c.id === id);
            showScreen('upgradeMenu');
        }

        function renderUpgrades() {
            document.getElementById('upgradeTitle').innerText = "Тюнинг: " + selectedCar.name;
            document.getElementById('engLvl').innerText = selectedCar.engine;
            document.getElementById('susLvl').innerText = selectedCar.suspension;
        }

        function upgradePart(part) {
            let cost = part === 'engine' ? 500 : 300;
            if (money >= cost) {
                money -= cost;
                if(part === 'engine') selectedCar.engine++;
                if(part === 'suspension') selectedCar.suspension++;
                renderUpgrades();
            } else {
                alert("Мало денег!");
            }
        }

        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('soundStatus').innerText = soundOn ? "ВКЛ" : "ВЫКЛ";
        }

        function toggleMusic() {
            musicOn = !musicOn;
            document.getElementById('musicStatus').innerText = musicOn ? "ВКЛ" : "ВЫКЛ";
        }

        function startGame() {
            showScreen('none');
            document.getElementById('game-ui').style.display = 'flex';
            document.getElementById('inGameSettings').style.display = 'flex';
            document.getElementById('gameStats').style.display = 'block';
            
            // Спавн на земле
            car.x = 200; 
            car.y = getTerrainY(200) - car.height; // Ставим на землю
            car.vx = 0; car.vy = 0; car.angle = 0; car.angVel = 0;
            
            currentRunDistance = 0;
            isPlaying = true;
            isPaused = false;
            initAudio();
        }

        function pauseGame() {
            isPaused = !isPaused;
            if(isPaused) showScreen('mainMenu'); // Показываем меню при паузе
            else showScreen('none');
        }

        // --- ЗВУК ---
        let audioCtx, engineOsc, engineGain;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth';
                engineOsc.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();
            }
        }
        function updateEngineSound(speed) {
            if (!audioCtx || !soundOn) { if(engineGain) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1); return; }
            let freq = 40 + Math.abs(speed) * 4 + (selectedCar.engine * 10);
            engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
            engineGain.gain.setTargetAtTime(0.03, audioCtx.currentTime, 0.1);
        }

        // --- ВВОД ---
        const bindTouch = (id, val) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); if(val==='gas') gasPressed = true; else brakePressed = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); if(val==='gas') gasPressed = false; else brakePressed = false; });
            el.addEventListener('mousedown', () => { if(val==='gas') gasPressed = true; else brakePressed = true; });
            el.addEventListener('mouseup', () => { if(val==='gas') gasPressed = false; else brakePressed = false; });
        };
        bindTouch('gasBtn', 'gas');
        bindTouch('brakeBtn', 'brake');

        // --- ЛОГИКА ---
        function update() {
            if (isPlaying && !isPaused) {
                car.vy += 0.6;

                let power = 0.3 + (selectedCar.engine * 0.1); 
                let spring = 0.8 - (selectedCar.suspension * 0.05); 

                let torque = 0;
                if (gasPressed) torque = power;
                if (brakePressed) torque = -power * 0.8;

                let onPuddle = puddles.some(p => car.x > p.x && car.x < p.x + p.w);
                if (onPuddle) { torque *= 0.3; car.vx *= 0.9; }

                car.vx += torque;
                car.vx *= 0.98; 
                
                if (gasPressed) car.angVel -= 0.003;
                if (brakePressed) car.angVel += 0.003;

                car.x += car.vx;
                car.y += car.vy;
                car.angle += car.angVel;

                // Коллизия
                let fX = car.x + Math.cos(car.angle) * (car.wheelBase/2);
                let fY = car.y + Math.sin(car.angle) * (car.wheelBase/2) + car.height/2;
                let gF = getTerrainY(fX);
                let rX = car.x - Math.cos(car.angle) * (car.wheelBase/2);
                let rY = car.y - Math.sin(car.angle) * (car.wheelBase/2) + car.height/2;
                let gR = getTerrainY(rX);

                if (fY > gF || rY > gR) {
                    if (fY > gF) car.y = gF - car.height/2;
                    if (rY > gR) car.y = gR - car.height/2;
                    if (fY > gF && rY > gR) car.y = Math.min(gF, gR) - car.height/2;
                    car.vy = 0;
                    
                    let groundAngle = Math.atan2(gF - gR, car.wheelBase);
                    car.angle = car.angle * spring + groundAngle * (1 - spring);
                    car.angVel *= 0.5;

                    if (Math.abs(car.vx) > 3 && Math.random() < 0.3) {
                        particles.push({ x: car.x, y: car.y + 20, vx: -car.vx*0.5, vy: -1, life: 1, color: onPuddle ? '#42a5f5' : '#8d6e63' });
                    }
                }

                // Камера
                cameraX = car.x - width / 3;
                cameraY += ((car.y - height * 0.6) - cameraY) * 0.1; 

                // --- СИСТЕМА ДЕНЕГ И МЕТРОВ ---
                currentRunDistance = Math.max(currentRunDistance, Math.floor(car.x / 10)); // 10 пикселей = 1 метр
                
                // Начисление денег каждые 250 метров
                if (currentRunDistance > 0 && currentRunDistance % 250 === 0 && currentRunDistance !== totalDistance) {
                    money += 5;
                    totalDistance = currentRunDistance;
                    // Эффект монетки
                    particles.push({ x: car.x, y: car.y - 50, vx: 0, vy: -2, life: 1, color: '#ffeb3b', text: '+$5' });
                }

                document.getElementById('moneyDisplay').innerText = money;
                document.getElementById('distDisplay').innerText = currentRunDistance;

                updateEngineSound(car.vx);

                if (car.x + 2000 > terrain[terrain.length-1].x) generateTerrain(terrain[terrain.length-1].x, terrain[terrain.length-1].x + 2000);

                particles.forEach((p, index) => {
                    p.x += p.vx; p.y += p.vy; p.life -= 0.02;
                    if(p.life <= 0) particles.splice(index, 1);
                });
            }

            draw();
            requestAnimationFrame(update);
        }

        // --- ГРАФИКА ---
        function drawCloud(x, y, size) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.arc(x + size*0.8, y - size*0.2, size*0.8, 0, Math.PI * 2);
            ctx.arc(x + size*1.5, y, size*0.9, 0, Math.PI * 2);
            ctx.arc(x + size*0.6, y + size*0.3, size*0.7, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBird(x, y, frame) {
            ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath();
            let wingY = Math.sin(frame) * 5;
            ctx.moveTo(x - 10, y + wingY); ctx.lineTo(x, y); ctx.lineTo(x + 10, y + wingY); ctx.stroke();
        }

        function drawAnimal(a, screenX, screenY) {
            ctx.fillStyle = a.type === 'cow' ? '#fff' : (a.type === 'horse' ? '#5d4037' : '#9e9e9e');
            let scale = a.offsetY / 40 + 0.5;
            ctx.save(); ctx.translate(screenX, screenY); ctx.scale(scale, scale);
            
            if (a.type === 'cow') {
                ctx.beginPath(); ctx.ellipse(0, -15, 20, 12, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(15, -20, 8, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(-5, -15, 5, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(-15, -5, 4, 15); ctx.fillRect(10, -5, 4, 15);
            } else if (a.type === 'horse') {
                ctx.beginPath(); ctx.ellipse(0, -15, 18, 10, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.moveTo(10, -20); ctx.lineTo(18, -35); ctx.lineTo(22, -35); ctx.lineTo(15, -15); ctx.fill();
                ctx.fillRect(-12, -5, 3, 15); ctx.fillRect(8, -5, 3, 15);
            } else {
                ctx.beginPath(); ctx.arc(0, -15, 12, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#424242'; ctx.beginPath(); ctx.arc(12, -18, 5, 0, Math.PI*2); ctx.fill();
                ctx.fillRect(-8, -5, 3, 10); ctx.fillRect(6, -5, 3, 10);
            }
            ctx.restore();
        }

        // ДЕТАЛИЗИРОВАННЫЕ МАШИНЫ
        function drawCarSprite(carType, color) {
            ctx.fillStyle = color;
            ctx.strokeStyle = '#111'; ctx.lineWidth = 2;

            if (carType === 'sedan') {
                // Силуэт седана (Mark II / Cobalt)
                ctx.beginPath();
                ctx.moveTo(-50, 0); // Задний бампер
                ctx.lineTo(-45, -25); // Багажник
                ctx.lineTo(-20, -35); // Заднее стекло
                ctx.lineTo(15, -35); // Крыша
                ctx.lineTo(35, -20); // Лобовое
                ctx.lineTo(50, -10); // Капот
                ctx.lineTo(50, 0); // Передний бампер
                ctx.closePath();
                ctx.fill(); ctx.stroke();

                // Стекла
                ctx.fillStyle = '#263238';
                ctx.beginPath(); ctx.moveTo(-35, -25); ctx.lineTo(-15, -32); ctx.lineTo(-10, -15); ctx.lineTo(-35, -15); ctx.fill();
                ctx.beginPath(); ctx.moveTo(0, -32); ctx.lineTo(30, -20); ctx.lineTo(35, -15); ctx.lineTo(0, -15); ctx.fill();
                
                // Детали: ручки, зеркала, фары
                ctx.fillStyle = '#000'; ctx.fillRect(-15, -20, 6, 2); ctx.fillRect(10, -20, 6, 2); // Ручки
                ctx.fillRect(35, -22, 5, 4); // Зеркало
                ctx.fillStyle = '#ffeb3b'; ctx.fillRect(45, -12, 5, 6); // Фара
                ctx.fillStyle = '#f44336'; ctx.fillRect(-50, -12, 5, 6); // Задний фонарь
                
                // Порог
                ctx.fillStyle = '#111'; ctx.fillRect(-40, 0, 80, 5);
            } else {
                // Внедорожник (Tucson)
                ctx.beginPath();
                ctx.moveTo(-50, 0); ctx.lineTo(-50, -25); ctx.lineTo(-35, -40);
                ctx.lineTo(15, -40); ctx.lineTo(40, -25); ctx.lineTo(50, 0);
                ctx.closePath(); ctx.fill(); ctx.stroke();
                
                // Стекла
                ctx.fillStyle = '#263238';
                ctx.fillRect(-45, -32, 30, 18); ctx.fillRect(-10, -35, 30, 20);

                // Детали: рейлинги на крыше
                ctx.fillStyle = '#000'; ctx.fillRect(-30, -43, 40, 3);
                ctx.fillRect(35, -25, 6, 5); // Зеркало
                ctx.fillStyle = '#ffeb3b'; ctx.fillRect(45, -15, 5, 8); // Фара
            }
        }

        function drawSpeedometer(speed) {
            let cx = width / 2, cy = height - 50, r = 70;
            ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, 0); ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(cx, cy, r-5, Math.PI, 0); ctx.stroke();
            
            for(let i=0; i<=10; i++) {
                let ang = Math.PI + (Math.PI/10)*i;
                ctx.beginPath(); ctx.moveTo(cx + Math.cos(ang)*(r-15), cy + Math.sin(ang)*(r-15));
                ctx.lineTo(cx + Math.cos(ang)*(r-5), cy + Math.sin(ang)*(r-5)); ctx.stroke();
            }

            let maxSpeed = 200;
            let angle = Math.PI + (Math.PI * Math.min(speed, maxSpeed) / maxSpeed);
            ctx.strokeStyle = '#f44336'; ctx.lineWidth = 5;
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(angle) * (r - 20), cy + Math.sin(angle) * (r - 20)); ctx.stroke();
            
            ctx.fillStyle = '#fff'; ctx.font = 'bold 22px Arial'; ctx.textAlign = 'center';
            ctx.fillText(Math.floor(speed), cx, cy + 25);
            ctx.textAlign = 'left';
        }

        function draw() {
            // Небо
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#1e88e5'); grad.addColorStop(0.6, '#90caf9'); grad.addColorStop(1, '#e3f2fd');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);

            clouds.forEach(c => drawCloud(c.x, c.y, c.size));
            birds.forEach(b => { b.frame += 0.1; drawBird(b.x, b.y, b.frame); });

            // Земля (Трава + Грунт)
            ctx.fillStyle = '#4caf50';
            ctx.beginPath(); ctx.moveTo(-100, height + 200); let started = false;
            for (let i = 0; i < terrain.length; i++) {
                let p = terrain[i]; let sx = p.x - cameraX; let sy = p.y - cameraY;
                if (sx > -100 && sx < width + 100) {
                    if (!started) { ctx.lineTo(sx, sy); started = true; } else ctx.lineTo(sx, sy);
                }
            }
            ctx.lineTo(width + 100, height + 200); ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#5d4037';
            ctx.beginPath(); ctx.moveTo(-100, height + 200); started = false;
            for (let i = 0; i < terrain.length; i++) {
                let p = terrain[i]; let sx = p.x - cameraX; let sy = p.y - cameraY + 15;
                if (sx > -100 && sx < width + 100) {
                    if (!started) { ctx.lineTo(sx, sy); started = true; } else ctx.lineTo(sx, sy);
                }
            }
            ctx.lineTo(width + 100, height + 200); ctx.closePath(); ctx.fill();

            animals.forEach(a => {
                let sx = a.x - cameraX;
                if (sx > -100 && sx < width + 100) drawAnimal(a, sx, getTerrainY(a.x) - cameraY);
            });

            puddles.forEach(p => {
                let sx = p.x - cameraX;
                if (sx > -300 && sx < width + 300) {
                    ctx.fillStyle = 'rgba(33, 150, 243, 0.6)'; ctx.beginPath();
                    ctx.moveTo(p.x - cameraX, getTerrainY(p.x) - cameraY + 5);
                    for (let x = p.x; x <= p.x + p.w; x += 20) ctx.lineTo(x - cameraX, getTerrainY(x) - cameraY + 5);
                    for (let x = p.x + p.w; x >= p.x; x -= 20) ctx.lineTo(x - cameraX, getTerrainY(x) - cameraY + 15);
                    ctx.fill();
                }
            });

            particles.forEach(p => {
                if(p.text) {
                    ctx.fillStyle = `rgba(255, 235, 59, ${p.life})`;
                    ctx.font = 'bold 20px Arial';
                    ctx.fillText(p.text, p.x - cameraX, p.y - cameraY);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); ctx.arc(p.x - cameraX, p.y - cameraY, 3, 0, Math.PI*2); ctx.fill();
                }
            });

            // МАШИНА
            ctx.save();
            ctx.translate(car.x - cameraX, car.y - cameraY);
            ctx.rotate(car.angle);
            
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath(); ctx.ellipse(0, 20, 55, 12, 0, 0, Math.PI*2); ctx.fill();

            drawCarSprite(selectedCar.type, selectedCar.color);

            // Колеса
            ctx.fillStyle = '#111';
            ctx.beginPath(); ctx.arc(-car.wheelBase/2, car.height/2 - 5, car.wheelRadius, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(car.wheelBase/2, car.height/2 - 5, car.wheelRadius, 0, Math.PI * 2); ctx.fill();
            
            ctx.fillStyle = '#bdbdbd';
            ctx.beginPath(); ctx.arc(-car.wheelBase/2, car.height/2 - 5, car.wheelRadius/2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(car.wheelBase/2, car.height/2 - 5, car.wheelRadius/2, 0, Math.PI * 2); ctx.fill();

            ctx.restore();

            if (isPlaying) drawSpeedometer(Math.abs(car.vx) * 15);
        }

        update();
    </script>
</body>
</html>
