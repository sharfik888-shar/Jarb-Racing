<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Jarb Racing</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* КРАСИВОЕ МЕНЮ */
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 10;
        }
        #menu h1 { 
            color: #fff; font-size: 50px; text-shadow: 4px 4px 0 #ff0000, 6px 6px 10px rgba(0,0,0,0.5); 
            margin-bottom: 40px; letter-spacing: 2px; font-style: italic;
        }
        .menu-btn {
            background: linear-gradient(to bottom, #ffcc00, #ff9900); 
            border: 3px solid #fff; padding: 15px 50px;
            font-size: 24px; font-weight: bold; border-radius: 15px;
            margin: 15px; cursor: pointer; color: #333;
            box-shadow: 0 8px 0 #b30000, 0 10px 20px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .menu-btn:active { transform: translateY(8px); box-shadow: 0 0 0 #b30000; }
        
        /* Настройки */
        #settings { position: absolute; top: 20px; right: 20px; z-index: 11; display: flex; gap: 15px; }
        .icon-btn {
            width: 55px; height: 55px; background: rgba(255,255,255,0.9);
            border: 3px solid #333; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-size: 26px; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Педали */
        #game-ui {
            position: absolute; bottom: 20px; width: 100%; display: none;
            justify-content: space-between; padding: 0 20px; box-sizing: border-box; z-index: 5;
        }
        .pedal {
            width: 100px; height: 100px; background: rgba(255,255,255,0.6);
            border: 4px solid #333; border-radius: 50%; display: flex;
            justify-content: center; align-items: center; font-size: 45px; font-weight: bold;
            user-select: none; -webkit-user-select: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .pedal:active { background: rgba(255,255,255,0.9); transform: scale(0.95); }
        
        /* Спидометр (сам рисуется на канвасе, тут только контейнер если нужен) */
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <!-- Меню -->
    <div id="menu">
        <h1>JARB RACING</h1>
        <button class="menu-btn" id="playBtn">ИГРАТЬ</button>
        <button class="menu-btn" id="upgradeBtn">ПРОКАЧКА</button>
    </div>

    <!-- Настройки -->
    <div id="settings">
        <div class="icon-btn" id="musicToggle">🎵</div>
        <div class="icon-btn" id="soundToggle">🔊</div>
    </div>

    <!-- Игровой интерфейс -->
    <div id="game-ui">
        <div class="pedal" id="brakeBtn">◀</div>
        <div class="pedal" id="gasBtn">▶</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let width = window.innerWidth;
        let height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;

        // --- ПЕРЕМЕННЫЕ ---
        let isPlaying = false;
        let musicOn = true;
        let soundOn = true;
        let cameraX = 0;
        let cameraY = 0;
        let gasPressed = false;
        let brakePressed = false;

        // --- ФИЗИКА МАШИНЫ ---
        const car = {
            x: 200, y: 100, vx: 0, vy: 0, angle: 0, angVel: 0,
            width: 80, height: 35, wheelBase: 60, wheelRadius: 18
        };

        // --- МИР ---
        let terrain = [];
        let puddles = [];
        
        // Облака и Птицы
        let clouds = [];
        let birds = [];
        
        // Животные
        let animals = [];
        
        function initWorld() {
            for(let i=0; i<15; i++) {
                clouds.push({ x: Math.random()*width*2, y: Math.random()*height*0.4 + 20, speed: Math.random()*0.5 + 0.1, size: Math.random()*30 + 20 });
            }
            for(let i=0; i<5; i++) {
                birds.push({ x: Math.random()*width*2, y: Math.random()*height*0.3 + 50, speed: Math.random()*1.5 + 0.5, frame: 0 });
            }
        }
        initWorld();

        function generateTerrain(startX, endX) {
            for (let x = startX; x < endX; x += 10) {
                if (x % 1500 === 0 && Math.random() < 0.4) {
                    puddles.push({ x: x, w: 150 + Math.random() * 200 });
                }
                let y = height - 100 + Math.sin(x * 0.003) * 60 + Math.sin(x * 0.01) * 30 + Math.sin(x * 0.0005) * 100;
                terrain.push({ x: x, y: y });
                
                // Спавним животных на ровных участках (каждые 500 пикселей)
                if (x % 400 === 0 && Math.random() < 0.7) {
                    let types = ['cow', 'horse', 'goat'];
                    animals.push({
                        x: x,
                        type: types[Math.floor(Math.random()*types.length)],
                        offsetY: Math.random() * 30, // Чуть дальше или ближе
                        color: `hsl(${Math.random()*40 + 20}, 50%, 50%)`
                    });
                }
            }
        }
        
        generateTerrain(-1000, 5000);

        function getTerrainY(x) {
            let index = Math.floor((x + 1000) / 10);
            if (index < 0) return height + 200;
            if (index >= terrain.length) return height + 200;
            return terrain[index].y;
        }

        function isInPuddle(x) {
            return puddles.find(p => x > p.x && x < p.x + p.w);
        }

        // --- ЗВУК ---
        let audioCtx, engineOsc, engineGain;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                engineOsc = audioCtx.createOscillator();
                engineGain = audioCtx.createGain();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.value = 50; 
                engineGain.gain.value = 0;
                engineOsc.connect(engineGain);
                engineGain.connect(audioCtx.destination);
                engineOsc.start();
            }
        }

        function updateEngineSound(speed) {
            if (!audioCtx || !soundOn) {
                if (engineGain) engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
                return;
            }
            let freq = 50 + Math.abs(speed) * 5;
            engineOsc.frequency.setTargetAtTime(freq, audioCtx.currentTime, 0.1);
            engineGain.gain.setTargetAtTime(0.05, audioCtx.currentTime, 0.1);
        }

        // --- УПРАВЛЕНИЕ ---
        document.getElementById('playBtn').addEventListener('click', () => {
            document.getElementById('menu').style.display = 'none';
            document.getElementById('game-ui').style.display = 'flex';
            isPlaying = true;
            initAudio(); 
        });

        document.getElementById('upgradeBtn').addEventListener('click', () => {
            alert("Тут будет прокачка двигателя, колес и т.д. (Скоро)");
        });

        document.getElementById('musicToggle').addEventListener('click', (e) => {
            musicOn = !musicOn;
            e.target.style.opacity = musicOn ? '1' : '0.3';
        });

        document.getElementById('soundToggle').addEventListener('click', (e) => {
            soundOn = !soundOn;
            e.target.style.opacity = soundOn ? '1' : '0.3';
        });

        const bindTouch = (id, val) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); if(val==='gas') gasPressed = true; else brakePressed = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); if(val==='gas') gasPressed = false; else brakePressed = false; });
            el.addEventListener('mousedown', () => { if(val==='gas') gasPressed = true; else brakePressed = true; });
            el.addEventListener('mouseup', () => { if(val==='gas') gasPressed = false; else brakePressed = false; });
        };
        bindTouch('gasBtn', 'gas');
        bindTouch('brakeBtn', 'brake');

        // --- ОБНОВЛЕНИЕ ---
        function update() {
            if (isPlaying) {
                car.vy += 0.6;

                let torque = 0;
                if (gasPressed) torque = 0.4;
                if (brakePressed) torque = -0.4;

                let currentGroundY = getTerrainY(car.x);
                if (isInPuddle(car.x) && car.y + car.height/2 > currentGroundY - 10) {
                    torque *= 0.3; 
                    car.vx *= 0.95; 
                }

                car.vx += torque;
                car.vx *= 0.98; 
                
                if (gasPressed) car.angVel -= 0.003;
                if (brakePressed) car.angVel += 0.003;

                car.x += car.vx;
                car.y += car.vy;
                car.angle += car.angVel;

                // Коллизия
                let fX = car.x + Math.cos(car.angle) * (car.wheelBase/2);
                let fY = car.y + Math.sin(car.angle) * (car.wheelBase/2) + car.height/2;
                let gF = getTerrainY(fX);
                let rX = car.x - Math.cos(car.angle) * (car.wheelBase/2);
                let rY = car.y - Math.sin(car.angle) * (car.wheelBase/2) + car.height/2;
                let gR = getTerrainY(rX);

                if (fY > gF || rY > gR) {
                    if (fY > gF) car.y = gF - car.height/2;
                    if (rY > gR) car.y = gR - car.height/2;
                    if (fY > gF && rY > gR) car.y = Math.min(gF, gR) - car.height/2;
                    car.vy = 0;
                    let groundAngle = Math.atan2(gF - gR, car.wheelBase);
                    car.angle = car.angle * 0.8 + groundAngle * 0.2;
                    car.angVel *= 0.5;
                }

                // Камера
                cameraX = car.x - width / 3;
                let targetCameraY = car.y - height * 0.6; 
                cameraY += (targetCameraY - cameraY) * 0.1; 

                updateEngineSound(car.vx);

                // Генерация мира
                if (car.x + 2000 > terrain[terrain.length-1].x) {
                    generateTerrain(terrain[terrain.length-1].x, terrain[terrain.length-1].x + 2000);
                }

                // Обновление птиц и облаков
                clouds.forEach(c => { c.x -= c.speed; if(c.x < -200) c.x = width + 200; });
                birds.forEach(b => { b.x -= b.speed; if(b.x < -50) { b.x = width + 50; b.y = Math.random()*height*0.3 + 50; } });
            }

            draw();
            requestAnimationFrame(update);
        }

        // --- ФУНКЦИИ РИСОВАНИЯ ---
        
        function drawCloud(x, y, size) {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.arc(x + size*0.8, y - size*0.2, size*0.8, 0, Math.PI * 2);
            ctx.arc(x + size*1.5, y, size*0.9, 0, Math.PI * 2);
            ctx.arc(x + size*0.6, y + size*0.3, size*0.7, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBird(x, y, frame) {
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            let wingY = Math.sin(frame) * 5;
            ctx.moveTo(x - 10, y + wingY);
            ctx.lineTo(x, y);
            ctx.lineTo(x + 10, y + wingY);
            ctx.stroke();
        }

        function drawAnimal(a, screenX, groundY) {
            // Рисуем силуэты животных (очень простые)
            ctx.fillStyle = a.type === 'cow' ? '#fff' : (a.type === 'horse' ? '#8B4513' : '#808080');
            
            // Тело
            ctx.beginPath();
            ctx.ellipse(screenX, groundY - 15, 15, 10, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Голова
            ctx.beginPath();
            ctx.arc(screenX + (a.type === 'cow' ? 15 : -15), groundY - 20, 6, 0, Math.PI*2);
            ctx.fill();

            // Ноги
            ctx.strokeStyle = ctx.fillStyle;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(screenX - 8, groundY - 5); ctx.lineTo(screenX - 8, groundY + 5);
            ctx.moveTo(screenX + 8, groundY - 5); ctx.lineTo(screenX + 8, groundY + 5);
            ctx.stroke();
        }

        function drawSpeedometer(speed) {
            let cx = width / 2;
            let cy = height - 40;
            let r = 60;
            
            // Фон спидометра
            ctx.fillStyle = 'rgba(0,0,0,0.7)';
            ctx.beginPath();
            ctx.arc(cx, cy, r, Math.PI, 0);
            ctx.fill();
            
            // Шкала
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, r - 5, Math.PI, 0);
            ctx.stroke();

            // Стрелка (макс скорость ~200 км/ч)
            let maxSpeed = 200;
            let angle = Math.PI + (Math.PI * Math.min(speed, maxSpeed) / maxSpeed);
            
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + Math.cos(angle) * (r - 15), cy + Math.sin(angle) * (r - 15));
            ctx.stroke();

            // Текст скорости
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 20px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(Math.floor(speed) + ' км/ч', cx, cy + 25);
            ctx.textAlign = 'left'; // сброс
        }

        // --- ОТРИСОВКА ---
        function draw() {
            // Небо
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, '#4facfe');
            grad.addColorStop(1, '#00f2fe');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // Облака
            clouds.forEach(c => drawCloud(c.x, c.y, c.size));

            // Птицы
            birds.forEach(b => { b.frame += 0.1; drawBird(b.x, b.y, b.frame); });

            // Земля
            ctx.fillStyle = '#5d4037'; 
            ctx.beginPath();
            ctx.moveTo(-100, height + 200);
            let started = false;
            for (let i = 0; i < terrain.length; i++) {
                let p = terrain[i];
                let screenX = p.x - cameraX;
                let screenY = p.y - cameraY;
                if (screenX > -100 && screenX < width + 100) {
                    if (!started) { ctx.lineTo(screenX, screenY); started = true; }
                    else ctx.lineTo(screenX, screenY);
                }
            }
            ctx.lineTo(width + 100, height + 200);
            ctx.closePath();
            ctx.fill();

            // Травка
            ctx.strokeStyle = '#4caf50';
            ctx.lineWidth = 8;
            ctx.beginPath();
            started = false;
            for (let i = 0; i < terrain.length; i++) {
                let p = terrain[i];
                let screenX = p.x - cameraX;
                let screenY = p.y - cameraY;
                if (screenX > -100 && screenX < width + 100) {
                    if (!started) { ctx.moveTo(screenX, screenY); started = true; }
                    else ctx.lineTo(screenX, screenY);
                }
            }
            ctx.stroke();

            // Животные (рисуем до луж и машины, чтобы были на фоне)
            animals.forEach(a => {
                let screenX = a.x - cameraX;
                if (screenX > -100 && screenX < width + 100) {
                    let groundY = getTerrainY(a.x) - cameraY;
                    drawAnimal(a, screenX, groundY + a.offsetY); 
                }
            });

            // Лужи
            puddles.forEach(p => {
                let screenX = p.x - cameraX;
                if (screenX > -300 && screenX < width + 300) {
                    ctx.fillStyle = 'rgba(0, 150, 255, 0.7)';
                    ctx.beginPath();
                    let startX = p.x;
                    let endX = p.x + p.w;
                    ctx.moveTo(startX - cameraX, getTerrainY(startX) - cameraY + 2);
                    for (let x = startX; x <= endX; x += 20) {
                        ctx.lineTo(x - cameraX, getTerrainY(x) - cameraY + 2);
                    }
                    for (let x = endX; x >= startX; x -= 20) {
                        ctx.lineTo(x - cameraX, getTerrainY(x) - cameraY + 15);
                    }
                    ctx.fill();
                }
            });

            // Машина
            ctx.save();
            ctx.translate(car.x - cameraX, car.y - cameraY);
            ctx.rotate(car.angle);
            
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.fillRect(-car.width/2, -car.height/2 + 5, car.width, car.height);

            ctx.fillStyle = '#e53935'; 
            ctx.beginPath();
            ctx.roundRect(-car.width/2, -car.height/2, car.width, car.height, 10);
            ctx.fill();
            
            ctx.fillStyle = '#90caf9';
            ctx.fillRect(-car.width/4, -car.height/2 + 5, car.width/2, car.height/3);

            ctx.fillStyle = '#212121';
            ctx.beginPath(); ctx.arc(-car.wheelBase/2, car.height/2, car.wheelRadius, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(car.wheelBase/2, car.height/2, car.wheelRadius, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#bdbdbd';
            ctx.beginPath(); ctx.arc(-car.wheelBase/2, car.height/2, car.wheelRadius/2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(car.wheelBase/2, car.height/2, car.wheelRadius/2, 0, Math.PI * 2); ctx.fill();

            ctx.restore();

            // Спидометр поверх всего
            if (isPlaying) {
                drawSpeedometer(Math.abs(car.vx) * 15);
            }
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                if (w < 2 * r) r = w / 2;
                if (h < 2 * r) r = h / 2;
                this.beginPath();
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                this.closePath();
                return this;
            };
        }

        update();
    </script>
</body>
</html>
